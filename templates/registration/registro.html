{% extends 'base.html' %}
{% load i18n %}

{% block title %}Registrarse{% endblock %}

{% block content %}
<div class="container mt-5" style="max-width: 500px;">
  <div class="card shadow">
    <div class="card-body">
      <h2 class="text-center mb-4">Crear cuenta</h2>

      {% if messages %}
        {% for m in messages %}
          <div class="alert alert-{{ m.tags }}">{{ m }}</div>
        {% endfor %}
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Nombre de usuario</label>
          <input type="text" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Contrasena</label>
          <input type="password" name="password1" class="form-control" required minlength="6">
        </div>
        <div class="mb-3">
          <label class="form-label">Repite la contrasena</label>
          <input type="password" name="password2" class="form-control" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary w-100">Crear cuenta</button>
      </form>

      <hr>
      <p class="text-center mb-0">
        Ya tienes cuenta? <a href="/accounts/login/">Inicia sesion</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
